openapi: 3.0.3
info:
  title: Jarvis KB API (for Clawdbot Integration)
  version: 1.0.0-draft.1
  description: |
    OpenAPI draft for Jarvis x Clawdbot v1 contract freeze (D1).

    Goals:
    - Reuse existing PG + Vector + Graph capabilities
    - Enforce structured envelope for traceability
    - Support bounded autonomy via propose/commit governance
    - Expose explicit degraded semantics and fallback path
    - Freeze cancel + cutover + decision_id contract deltas for Batch-1

servers:
  - url: https://jarvis.internal
    description: Production (example)
  - url: http://localhost:8088
    description: Local development

tags:
  - name: system
    description: Health and capability endpoints
  - name: ingest
    description: Event ingestion and replay
  - name: memory
    description: Proposal/commit/conflict endpoints
  - name: retrieval
    description: Search and chunk retrieval
  - name: graph
    description: Graph neighborhood and impact analysis
  - name: symbols
    description: Symbol lookup (repo/code intelligence)
  - name: artifacts
    description: Artifact store and feedback
  - name: approval
    description: Approval workflow and ticket lifecycle
  - name: audit
    description: Audit query and trace retrieval
  - name: governance
    description: Data governance policy endpoints
  - name: quota
    description: Capacity and budget quota policy endpoints

security:
  - bearerAuth: []

paths:
  /v0/health:
    get:
      tags: [system]
      summary: kb_health
      operationId: getHealth
      responses:
        "200":
          description: Service health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v0/capabilities:
    get:
      tags: [system]
      summary: kb_capabilities
      operationId: getCapabilities
      responses:
        "200":
          description: Supported features and policy surfaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"

  /v0/events/ingest:
    post:
      tags: [ingest]
      summary: kb_ingest_event
      operationId: ingestEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventRequest"
      responses:
        "202":
          description: Event accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventResponse"
        "409":
          description: Idempotency hit or version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v0/events/replay/run:
    post:
      tags: [ingest]
      summary: Run replay worker once (manual recovery)
      operationId: runReplay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayRunRequest"
      responses:
        "200":
          description: Replay pass completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayRunResponse"

  /v0/memory/proposals:
    post:
      tags: [memory]
      summary: kb_memory_propose
      operationId: createMemoryProposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryProposalRequest"
      responses:
        "202":
          description: Proposal accepted into policy gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryProposalResponse"
        "409":
          description: Duplicate idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v0/memory/proposals/{proposalId}/commit:
    post:
      tags: [memory]
      summary: kb_memory_commit
      operationId: commitMemoryProposal
      parameters:
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCommitRequest"
      x-contract-rules:
        proposal_id_must_match_path_param: true
        mismatch_error_code: VALIDATION_ERROR
      responses:
        "200":
          description: Proposal committed into long-term memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryCommitResponse"
        "403":
          description: Policy denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v0/approval-tickets:
    get:
      tags: [approval]
      summary: List approval tickets
      operationId: listApprovalTickets
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, canceled, expired]
        - in: query
          name: subject_type
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Approval tickets list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalTicketListResponse"

  /v0/approval-tickets/{approvalId}:
    get:
      tags: [approval]
      summary: Get approval ticket
      operationId: getApprovalTicket
      parameters:
        - in: path
          name: approvalId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalTicketResponse"
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v0/approval-tickets/{approvalId}/approve:
    post:
      tags: [approval]
      summary: Approve ticket
      operationId: approveTicket
      parameters:
        - in: path
          name: approvalId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalActionRequest"
      responses:
        "200":
          description: Ticket approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalActionResponse"
        "403":
          description: Role or scope denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ticket already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v0/approval-tickets/{approvalId}/reject:
    post:
      tags: [approval]
      summary: Reject ticket
      operationId: rejectTicket
      parameters:
        - in: path
          name: approvalId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalActionRequest"
      responses:
        "200":
          description: Ticket rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalActionResponse"
        "403":
          description: Role or scope denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ticket already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v0/approval-tickets/{approvalId}/expire:
    post:
      tags: [approval]
      summary: Expire ticket
      operationId: expireTicket
      parameters:
        - in: path
          name: approvalId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalActionRequest"
      responses:
        "200":
          description: Ticket expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalActionResponse"
        "403":
          description: Role or scope denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ticket already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v0/approval-tickets/{approvalId}/cancel:
    post:
      tags: [approval]
      summary: Cancel ticket
      operationId: cancelTicket
      parameters:
        - in: path
          name: approvalId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalActionRequest"
      responses:
        "200":
          description: Ticket canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalActionResponse"
        "403":
          description: Role or scope denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ticket already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v0/cutover/runs:
    post:
      tags: [system]
      summary: Create cutover run
      operationId: createCutoverRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CutoverRunCreateRequest"
      responses:
        "200":
          description: Cutover run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CutoverRunResponse"
        "409":
          description: Existing active cutover run blocks creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v0/cutover/runs/{cutoverId}/advance:
    post:
      tags: [system]
      summary: Advance cutover run stage
      operationId: advanceCutoverRun
      parameters:
        - in: path
          name: cutoverId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CutoverAdvanceRequest"
      responses:
        "200":
          description: Cutover run advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CutoverRunResponse"
        "409":
          description: Stage guard rejected transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v0/cutover/runs/{cutoverId}/rollback:
    post:
      tags: [system]
      summary: Roll back cutover run stage
      operationId: rollbackCutoverRun
      parameters:
        - in: path
          name: cutoverId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CutoverRollbackRequest"
      responses:
        "200":
          description: Cutover run rolled back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CutoverRunResponse"
        "409":
          description: Rollback denied by state guard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v0/audit/requests:
    get:
      tags: [audit]
      summary: Query request/audit trail
      operationId: listAuditRequests
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
        - in: query
          name: request_id
          required: false
          schema:
            type: string
        - in: query
          name: trace_id
          required: false
          schema:
            type: string
        - in: query
          name: reason_code
          required: false
          schema:
            $ref: "#/components/schemas/ReasonCode"
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Audit request list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRequestListResponse"

  /v0/governance/policies/{tenantId}/{workspaceId}:
    get:
      tags: [governance]
      summary: Get governance policy
      operationId: getGovernancePolicy
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Governance policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernancePolicyResponse"
    put:
      tags: [governance]
      summary: Upsert governance policy
      operationId: upsertGovernancePolicy
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernancePolicyUpsertRequest"
      responses:
        "200":
          description: Policy upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernancePolicyResponse"

  /v0/quotas/{tenantId}/{workspaceId}:
    get:
      tags: [quota]
      summary: Get quota policy
      operationId: getQuotaPolicy
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quota policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaPolicyResponse"
    put:
      tags: [quota]
      summary: Upsert quota policy
      operationId: upsertQuotaPolicy
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaPolicyUpsertRequest"
      responses:
        "200":
          description: Quota policy upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaPolicyResponse"

  /v0/quotas/{tenantId}/{workspaceId}/usage:
    get:
      tags: [quota]
      summary: Get quota usage snapshot
      operationId: getQuotaUsage
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quota usage snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaUsageResponse"

  /v0/events/replay/dead-letter/{deadLetterId}/resolve:
    post:
      tags: [ingest]
      summary: Resolve dead-letter item manually
      operationId: resolveDeadLetter
      parameters:
        - in: path
          name: deadLetterId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeadLetterResolveRequest"
      responses:
        "200":
          description: Dead-letter item resolved or re-queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadLetterResolveResponse"

  /v0/memory/conflicts/preview:
    post:
      tags: [memory]
      summary: kb_memory_conflict_preview
      operationId: previewMemoryConflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryConflictPreviewRequest"
      responses:
        "200":
          description: Conflict candidates and suggested actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryConflictPreviewResponse"

  /v0/search:
    post:
      tags: [retrieval]
      summary: kb_search
      operationId: searchKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results with evidence and degraded info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

  /v0/chunks/{chunkId}:
    get:
      tags: [retrieval]
      summary: kb_get_chunk
      operationId: getChunk
      parameters:
        - in: path
          name: chunkId
          required: true
          schema:
            type: string
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chunk payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetChunkResponse"
        "404":
          description: Chunk not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v0/chunks/batch-get:
    post:
      tags: [retrieval]
      summary: kb_get_chunks
      operationId: batchGetChunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchGetChunksRequest"
      responses:
        "200":
          description: Batch chunk payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetChunksResponse"

  /v0/graph/entities/{entityId}/neighbors:
    get:
      tags: [graph]
      summary: kb_graph_neighbors
      operationId: getGraphNeighbors
      parameters:
        - in: path
          name: entityId
          required: true
          schema:
            type: string
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
        - in: query
          name: hops
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 3
            default: 1
        - in: query
          name: relation_type
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Neighbor nodes and edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphNeighborsResponse"

  /v0/graph/impact-report:
    post:
      tags: [graph]
      summary: kb_impact_report_pg
      operationId: getImpactReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpactReportRequest"
      responses:
        "200":
          description: Impact report generated from graph + relational joins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactReportResponse"

  /v0/symbols/lookup:
    post:
      tags: [symbols]
      summary: kb_symbol_lookup_pg
      operationId: lookupSymbol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SymbolLookupRequest"
      responses:
        "200":
          description: Symbol lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolLookupResponse"

  /v0/artifacts:
    post:
      tags: [artifacts]
      summary: kb_store_artifact
      operationId: storeArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreArtifactRequest"
      responses:
        "201":
          description: Artifact stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreArtifactResponse"

  /v0/artifacts/{artifactId}:
    get:
      tags: [artifacts]
      summary: kb_get_artifact
      operationId: getArtifact
      parameters:
        - in: path
          name: artifactId
          required: true
          schema:
            type: string
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetArtifactResponse"
        "404":
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v0/artifacts/{artifactId}/feedback:
    post:
      tags: [artifacts]
      summary: kb_feedback
      operationId: submitArtifactFeedback
      parameters:
        - in: path
          name: artifactId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactFeedbackRequest"
      responses:
        "200":
          description: Feedback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactFeedbackResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT must include: sub, tenant_id, workspace_id, actor_role, scope, iss, aud, exp.
        Authorization is fail-closed when required claims are missing or mismatched.

  schemas:
    Envelope:
      type: object
      required:
        - envelope_version
        - request_id
        - trace_id
        - source_system
        - tenant_id
        - workspace_id
        - actor
        - scope
      properties:
        envelope_version:
          type: string
          example: v1
        request_id:
          type: string
          example: req_01JARVIS7W9P2W2W8Y3Q6NJ
        trace_id:
          type: string
          example: tr_01JARVIS7W9P2W2W8Y3Q6NJ
        source_system:
          type: string
          enum: [clawdbot, opencode, mobile, obsidian, repo_sync]
        tenant_id:
          type: string
          example: tenant_default
        workspace_id:
          type: string
          example: ws_main
        actor:
          $ref: "#/components/schemas/ActorContext"
        scope:
          $ref: "#/components/schemas/ScopeContext"
        budget:
          $ref: "#/components/schemas/BudgetContext"
        degrade_policy:
          $ref: "#/components/schemas/DegradePolicy"

    ActorContext:
      type: object
      required: [actor_id, actor_type]
      properties:
        actor_id:
          type: string
        actor_type:
          type: string
          enum: [agent, user, policy_engine, system, human_reviewer]
        session_id:
          type: string

    ScopeContext:
      type: object
      required: [scope_type, scope_id]
      properties:
        scope_type:
          type: string
          enum: [workspace, project, domain]
        scope_id:
          type: string

    BudgetContext:
      type: object
      properties:
        latency_ms:
          type: integer
          minimum: 50
        max_candidates:
          type: integer
          minimum: 1
          maximum: 500

    DegradePolicy:
      type: object
      properties:
        allow_degraded:
          type: boolean
          default: true
        require_reason:
          type: boolean
          default: true

    ResponseMeta:
      type: object
      required: [request_id, trace_id, status, timestamp, degraded]
      properties:
        request_id:
          type: string
        trace_id:
          type: string
        status:
          type: string
          enum: [ok, accepted, error]
        timestamp:
          type: string
